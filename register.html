<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | AutoVerse</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><header class="navbar"><a class="logo" href="index.html">🚗 Auto<span>Verse</span></a><a class="back-home" href="index.html">← Home</a></header><main class="auth-wrap"><div class="auth-box"><div class="auth-icon">👤</div><h1>Create Account</h1><p>Join the AutoVerse community.</p><form id="registerForm" novalidate><label>Full Name</label><input id="fullName" type="text" placeholder="Your full name"><small id="nameError"></small><label>Email</label><input id="email" type="email" placeholder="you@example.com"><small id="emailError"></small><label>Username</label><input id="username" type="text" placeholder="Choose a username"><small id="usernameError"></small><label>Password</label><input id="password" type="password" placeholder="Minimum 8 characters"><small id="passwordError"></small><label>Confirm Password</label><input id="confirmPassword" type="password" placeholder="Repeat password"><small id="confirmError"></small><button class="btn primary full" type="submit">Create Account</button><div id="registerMessage" class="form-message"></div></form><p class="switch">Already have an account? <a href="login.html">Login</a></p></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>initRegister();</script></body></html>
